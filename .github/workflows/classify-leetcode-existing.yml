name: Normalize LeetCode Structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize folders
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          mkdir -p LeetCode

          moved=0

          for d in **/[0-9][0-9][0-9][0-9]-*; do
            if [ ! -d "$d" ]; then
              continue
            fi

            if [[ "$d" == LeetCode/* ]]; then
              continue
            fi

            name="$(basename "$d")"
            target="LeetCode/$name"

            if [ -e "$target" ]; then
              echo "[SKIP] target exists: $target"
              continue
            fi

            echo "[MOVE] $d -> $target"
            mv "$d" "$target"
            moved=1
          done

          if [ "$moved" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: normalize LeetCode folder structure" || echo "No changes to commit"
            git push
          else
            echo "No folders moved"
          fi
