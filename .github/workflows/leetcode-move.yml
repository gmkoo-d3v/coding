name: Move LeetCode Solutions

on:
  workflow_dispatch:
  push:
    paths:
      - '[0-9][0-9][0-9][0-9]-*/**'

permissions:
  contents: write

jobs:
  move-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Move LeetCode solutions
        id: move
        shell: bash
        run: |
          shopt -s nullglob

          echo "Current directory contents:"
          ls -la

          mkdir -p LeetCode

          echo "Changed files in this push:"
          git diff --name-only HEAD^ HEAD || true

          moved=0
          for d in [0-9][0-9][0-9][0-9]-*; do
            [ -d "$d" ] || continue
            echo "Moving directory: $d"
            mv "$d" LeetCode/
            moved=1
          done

          echo "moved=$moved" >> "$GITHUB_OUTPUT"

      - name: Commit & Push changes
        if: steps.move.outputs.moved == '1'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "chore: Move LeetCode solutions to LeetCode folder"
          git push origin HEAD:${GITHUB_REF_NAME}
